name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run API and mocked AI/pipeline tests
        run: python -m pytest -q
      - name: Validate Compose definitions
        run: |
          docker compose config --quiet
          docker compose -f compose.lab.yaml config --quiet
      - name: Build and start standalone API
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Check live API responses
        run: python scripts/smoke_api.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop standalone API
        if: always()
        run: docker compose down
